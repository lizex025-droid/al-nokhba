name: Optimize material images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-material-images.yml'
      - 'public/materials/*.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert large PNG banners to compact WebP
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for png in Path("public/materials").glob("*.png"):
              target = png.with_suffix(".webp")
              with Image.open(png) as source:
                  source = source.convert("RGB")
                  source.save(target, "WEBP", quality=78, method=6)
              print(png.name, png.stat().st_size, target.stat().st_size)
          PY
      - name: Switch site card image paths to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/lib/content.ts")
          s=p.read_text()
          for name in ["physical-therapy","occupational-therapy","prosthetics-orthotics","hearing-speech","faculty-requirements","university-requirements"]:
              s=s.replace(f"/materials/{name}.png", f"/materials/{name}.webp")
          p.write_text(s)
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/materials/*.webp src/lib/content.ts
          if ! git diff --cached --quiet; then
            git commit -m "Optimize six material images as WebP"
            git push
          fi
